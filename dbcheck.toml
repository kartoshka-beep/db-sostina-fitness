# Настройки чекера. Остальное dbcheck находит сам по системному каталогу базы.

[project]
theme = 0                 # номер темы
# Главная таблица темы. В лабе 5 в ней должно быть не меньше 100 000 строк.
# Если не указана, берётся самая большая таблица.
main_table = ""

[lab4]
# Бизнес-операция, которую должна уметь роль app_writer. Чекер выполнит её под app_writer и откатит.
# Пример: writer_call = "SELECT place_order(1, 2)"
writer_call = "SELECT register_client_safe((SELECT c.id FROM clients c WHERE NOT EXISTS (SELECT 1 FROM registrations r WHERE r.client_id = c.id AND r.class_id = 1) ORDER BY c.id LIMIT 1), 1)"
